om negative operating cash flow. Net sale proceeds are separate from operating </text><text x="16" y="400" font-family="Arial,sans-serif" font-size="11" fill="#263d58">distributions, after selling costs and loan payoff. Nominal recovery does not account for the time value of money. Origin: </text><text x="16" y="418" font-family="Arial,sans-serif" font-size="11" fill="#263d58">fictional example; edits and copies retain this origin. Figures are illustrative, not verified property information. </text></svg>